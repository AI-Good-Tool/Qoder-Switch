[package]
name = "qoder-switch"
version = "1.7.4"
description = "Qoder account switcher and daily credits auto-claim"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
