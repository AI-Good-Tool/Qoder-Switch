name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Test platform and gateway contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test runtime adapter offline
        run: node --test scripts/qoder-runtime.test.mjs
      - name: Check frontend syntax
        run: |
          node --check ui/gateway.js
          node --check ui/gateway-shell.js
          node --check ui/app.js
          node --check ui/about.js
          node --check ui/about-shell.js

  # 单独创建/获取 Release，避免并行构建任务同时建 Release 的竞态（422 already_exists）
  create-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = 'v${{ steps.ver.outputs.version }}';
            const owner = context.repo.owner, repo = context.repo.repo;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const ref = await github.rest.repos.getCommit({ owner, repo, ref: tag });
              if (ref.data.sha !== context.sha) {
                throw new Error(`Release ${tag} points to a different commit; bump the app version before publishing.`);
              }
              core.info(`Release ${tag} already exists (id=${existing.data.id}), reusing it`);
              return existing.data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
              const created = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Qoder Switch ${tag}`,
                body: '前往 Assets 下载对应平台的安装包。macOS：Apple Silicon 下载 aarch64.dmg，Intel 下载 x64.dmg；Windows 下载 x64-setup.exe。',
                draft: false,
                prerelease: false,
              });
              core.info(`Created release ${tag} (id=${created.data.id})`);
              return created.data.id;
            }

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest # Intel (x86_64)
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest # Windows x64
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
